<!DOCTYPE html>
<html>

<head>
    <title>React Basics</title>
    <style>
        body {
            background-color: black;
            color: aliceblue;
            font-family: 'Courier New', Courier, monospace;
        }
        .input-email{
            padding: 10px;
            border-radius: 8px;
            border: none;
            margin: 10px;
        }
        .input-password{
            padding: 10px;
            border-radius: 8px;
            border: none;
            margin: 10px;
        }

        .login-btn{
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 15px;
            background-color: rgb(0, 123, 255);
            color: white;
            border: none;
            margin: 10px;
            cursor: pointer;
        }
        .signup-btn{
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 15px;
            background-color: rgb(0, 123, 255);
            color: white;
            border: none;
            margin: 10px;
            cursor: pointer;
        }
        .password-show-btn{
            padding: 10px 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/external-library.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

        function App() {
            return (
                <>
                    <p>Hello, welcome to my website!</p>
                    <Loginform />
                </>
            )
        }

        function Loginform() {

            const [showState, setHideState] = React.useState('Show')

            function hideButton() {
                setHideState('Hide')
            }

            return (
                <>
                    <div>
                        <input className="input-email" type="email" placeholder="Email" />
                    </div>
                    <div>
                        <input className="input-password" type={showState === "Show" ? "password" : "text"} placeholder="Password" />
                        <button className="password-show-btn" onClick={hideButton}>{showState}</button>
                    </div>
                    <button className="login-btn">Login</button>
                    <button className="signup-btn">Sign up</button>
                </>
            )
        }


        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />)
    </script>



</body>

</html>
