<!DOCTYPE html>
<html>

<head>
    <title>React Basics</title>
    <style>
        body {
            background-color: black;
        }

        .container-button-on {
            background-color: rgb(25, 135, 84);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
        }
        .container-button-off {
            background-color: rgb(196, 13, 13);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/external-library.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

        function App() {
            const [buttonState, setButtonState] = React.useState("ON")

            // function toggleButton() {
            //     setButtonState(buttonState === "ON" ? "OFF" : "ON");
            // }

            return (
                <>
                    <button className={
                        buttonState === "ON" 
                        ? "container-button-on" 
                        : "container-button-off"
                    } 
                    onClick={() => setButtonState("OFF")}
                    >
                        {buttonState}
                    </button>
                </>
            )
        }


        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />)
    </script>



</body>

</html>
