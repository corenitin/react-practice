<!DOCTYPE html>
<html>

<head>
    <title>React Basics</title>
</head>

<body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/external-library.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

        const currentDate = dayjs().format('MMMM D')
        const currentTime = dayjs().format('HH:mm:ss')
        console.log(currentTime);
        


        const priceOfSocks = 10;
        const priceOfTshirt = 8;
        const shippingCost = 5;
        const productCost = priceOfSocks + (2 * priceOfTshirt)
        const totalCost = shippingCost + productCost

        const div = (
            <div>
                <button>Good job!</button>
                <p>My name is Nitin.</p>
                <br></br>
                <p>Cotton socks</p>
                <p>Price: ₹10</p>
                <button>Add to Cart</button>
                <br></br>
                <p>Product cost: ₹ {productCost}</p>
                <p>Shipping cost: ₹ {shippingCost}</p>
                <p>Total cost: ₹ {totalCost}</p>
                <button>Place your order</button>
                <br></br>
                <p>Today is {currentDate}</p>
            </div>
        );
        

        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(div)
    </script>

    
</body>

</html>
